<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMSHUB.XYZ - Ultimate Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-black text-gray-100 font-sans min-h-screen" x-data="adminApp()" x-init="initAdmin()">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col justify-between p-4">
      <div class="space-y-6">
        <h1 class="text-xl font-black text-red-600 tracking-wider">ADMIN<span class="text-yellow-400">PANEL</span></h1>
        
        <nav class="space-y-1 text-xs font-bold">
          <button @click="tab = 'stats'" :class="tab === 'stats' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'" class="w-full text-left p-3 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-chart-line"></i> Dashboard & Analytics
          </button>
          <button @click="tab = 'upload'" :class="tab === 'upload' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'" class="w-full text-left p-3 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> Upload Media
          </button>
          <button @click="tab = 'posts'" :class="tab === 'posts' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'" class="w-full text-left p-3 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-film"></i> Manage Posts
          </button>
          <button @click="tab = 'categories'" :class="tab === 'categories' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'" class="w-full text-left p-3 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-folder"></i> Category Manager
          </button>
          <button @click="tab = 'payments'" :class="tab === 'payments' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'" class="w-full text-left p-3 rounded-xl flex items-center justify-between">
            <span class="flex items-center gap-2"><i class="fa-solid fa-crown text-yellow-400"></i> VIP Approvals</span>
            <span x-show="pendingPayments.length > 0" class="bg-yellow-500 text-black px-1.5 py-0.5 rounded-full text-[10px]" x-text="pendingPayments.length"></span>
          </button>
          <button @click="tab = 'ads'" :class="tab === 'ads' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-800'" class="w-full text-left p-3 rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-rectangle-ad"></i> SmartLink Ads Setup
          </button>
        </nav>
      </div>

      <div class="text-[10px] text-gray-500 text-center">
        MMSHUB.XYZ Admin Console
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 overflow-y-auto p-6 bg-black">

      <!-- Tab 1: Stats -->
      <div x-show="tab === 'stats'" class="space-y-6">
        <h2 class="text-lg font-bold text-gray-200">System Overview & Analytics</h2>
        <div class="grid grid-cols-4 gap-4">
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl">
            <span class="text-xs text-gray-400 font-bold block">Total Uploads</span>
            <span class="text-2xl font-black text-white" x-text="posts.length"></span>
          </div>
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl">
            <span class="text-xs text-gray-400 font-bold block">Categories</span>
            <span class="text-2xl font-black text-white" x-text="categories.length"></span>
          </div>
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl">
            <span class="text-xs text-gray-400 font-bold block">Pending VIP Requests</span>
            <span class="text-2xl font-black text-yellow-400" x-text="pendingPayments.length"></span>
          </div>
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-2xl">
            <span class="text-xs text-gray-400 font-bold block">Total Stream Views</span>
            <span class="text-2xl font-black text-emerald-400" x-text="getTotalViews()"></span>
          </div>
        </div>
      </div>

      <!-- Tab 2: Upload Media -->
      <div x-show="tab === 'upload'" class="max-w-2xl space-y-4">
        <h2 class="text-lg font-bold text-gray-200">Publish New Video Post</h2>
        <div class="space-y-3 text-xs">
          <input type="text" x-model="post.title" placeholder="Video Title" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white">
          <input type="text" x-model="post.thumbnail" placeholder="Thumbnail Image URL" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white">
          <textarea x-model="post.iframeUrl" placeholder="Embed / Iframe Code or Direct Stream Link" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white h-24"></textarea>
          <input type="text" x-model="post.downloadUrl" placeholder="MEGA Download File Link" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white">
          
          <select x-model="post.category" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white">
            <option value="">Select Category</option>
            <template x-for="cat in categories" :key="cat">
              <option :value="cat" x-text="cat"></option>
            </template>
          </select>

          <div class="flex items-center gap-2 bg-gray-900 p-3 rounded-xl border border-gray-800">
            <input type="checkbox" x-model="post.isPremium" id="premCheck" class="accent-red-600">
            <label for="premCheck" class="font-bold text-yellow-400">Lock as Premium Content (VIP Only)</label>
          </div>

          <button @click="savePost()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl">Publish Post Now</button>
        </div>
      </div>

      <!-- Tab 3: Posts List -->
      <div x-show="tab === 'posts'" class="space-y-4">
        <h2 class="text-lg font-bold text-gray-200">All Published Media</h2>
        <div class="space-y-2">
          <template x-for="p in posts" :key="p.id">
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-800 flex justify-between items-center text-xs">
              <div class="flex items-center gap-3">
                <img :src="p.thumbnail" class="w-12 h-8 object-cover rounded">
                <div>
                  <div class="font-bold text-white" x-text="p.title"></div>
                  <span class="text-[10px] text-gray-400" x-text="p.category"></span>
                </div>
              </div>
              <button @click="deletePost(p.id)" class="bg-red-950 text-red-400 p-2 rounded-lg font-bold"><i class="fa-solid fa-trash"></i></button>
            </div>
          </template>
        </div>
      </div>

      <!-- Tab 4: Categories -->
      <div x-show="tab === 'categories'" class="max-w-md space-y-4">
        <h2 class="text-lg font-bold text-gray-200">Manage Categories</h2>
        <div class="flex gap-2">
          <input type="text" x-model="newCat" placeholder="New Category Name" class="bg-gray-900 border border-gray-800 rounded-xl p-2.5 text-xs w-full text-white">
          <button @click="addCategory()" class="bg-red-600 text-white text-xs px-4 rounded-xl font-bold">Add</button>
        </div>
        <div class="space-y-2">
          <template x-for="cat in categories" :key="cat">
            <div class="bg-gray-900 p-2.5 rounded-xl border border-gray-800 flex justify-between items-center text-xs">
              <span class="font-bold" x-text="cat"></span>
              <button @click="deleteCategory(cat)" class="text-red-500 font-bold">&times;</button>
            </div>
          </template>
        </div>
      </div>

      <!-- Tab 5: Payments Approval -->
      <div x-show="tab === 'payments'" class="space-y-4">
        <h2 class="text-lg font-bold text-yellow-400">VIP Order Approvals</h2>
        <div class="space-y-2">
          <template x-for="req in pendingPayments" :key="req.id">
            <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex justify-between items-center text-xs">
              <div>
                <div class="font-bold text-emerald-400 text-sm" x-text="req.username"></div>
                <div class="text-gray-300">Package: <span x-text="req.package"></span></div>
                <div class="text-amber-400 font-bold">TrxID: <span x-text="req.trxId"></span></div>
              </div>
              <button @click="approvePayment(req)" class="bg-emerald-600 text-white px-4 py-2 rounded-xl font-bold">Approve Membership</button>
            </div>
          </template>
        </div>
      </div>

      <!-- Tab 6: SmartLink Ads -->
      <div x-show="tab === 'ads'" class="max-w-md space-y-4">
        <h2 class="text-lg font-bold text-gray-200">3-Step SmartLink Ad Manager</h2>
        <div class="space-y-3 text-xs">
          <input type="text" x-model="ads.link1" placeholder="Ad Link 1 URL" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white">
          <input type="text" x-model="ads.link2" placeholder="Ad Link 2 URL" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white">
          <input type="text" x-model="ads.link3" placeholder="Ad Link 3 URL" class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-white">
          <button @click="saveAds()" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Save SmartLinks</button>
        </div>
      </div>

    </main>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD8Jn_pGJ-SBiDsBjys0DzA1CiIElTebbE",
      authDomain: "mmshub-79800.firebaseapp.com",
      projectId: "mmshub-79800",
      storageBucket: "mmshub-79800.firebasestorage.app",
      messagingSenderId: "688169155815",
      appId: "1:688169155815:web:ecfd75c3a19834f2bdb642",
      measurementId: "G-7W5ER16DZ3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function adminApp() {
      return {
        tab: 'stats',
        posts: [],
        categories: [],
        pendingPayments: [],
        newCat: '',
        post: { title: '', thumbnail: '', iframeUrl: '', downloadUrl: '', category: '', isPremium: false },
        ads: { link1: '', link2: '', link3: '' },

        initAdmin() {
          this.loadPosts();
          this.loadCategories();
          this.loadPayments();
          this.loadAds();
        },

        loadPosts() {
          db.collection("videos").onSnapshot(snap => {
            this.posts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          });
        },

        loadCategories() {
          db.collection("categories").onSnapshot(snap => {
            this.categories = snap.docs.map(d => d.data().name);
          });
        },

        loadPayments() {
          db.collection("paymentRequests").where("status", "==", "pending").onSnapshot(snap => {
            this.pendingPayments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          });
        },

        loadAds() {
          db.collection("settings").doc("ads").get().then(doc => {
            if (doc.exists) this.ads = doc.data();
          });
        },

        getTotalViews() {
          return this.posts.reduce((acc, p) => acc + (p.views || 0), 0);
        },

        savePost() {
          if(!this.post.title || !this.post.iframeUrl) return alert("Fill title and iframe URL!");
          db.collection("videos").add({
            ...this.post,
            views: 0,
            likes: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).then(() => {
            alert("Post Published!");
            this.post = { title: '', thumbnail: '', iframeUrl: '', downloadUrl: '', category: '', isPremium: false };
          });
        },

        deletePost(id) {
          if(confirm("Delete post?")) db.collection("videos").doc(id).delete();
        },

        addCategory() {
          if(!this.newCat) return;
          db.collection("categories").doc(this.newCat).set({ name: this.newCat });
          this.newCat = '';
        },

        deleteCategory(cat) {
          db.collection("categories").doc(cat).delete();
        },

        approvePayment(req) {
          db.collection("users").doc(req.username).update({ isPremium: true }).then(() => {
            db.collection("paymentRequests").doc(req.id).update({ status: "approved" });
            alert(`User ${req.username} activated as VIP!`);
          });
        },

        saveAds() {
          db.collection("settings").doc("ads").set(this.ads).then(() => alert("Ad Links Saved!"));
        }
      }
    }
  </script>
</body>
</html>
